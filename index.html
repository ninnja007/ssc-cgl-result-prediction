<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Vidhi ❤️</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap');
        
        body {
            margin: 0;
            overflow-x: hidden; /* Prevent horizontal scroll, allow vertical */
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .font-serif { font-family: 'Playfair Display', serif; }
        .font-writing { font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive, sans-serif; }

        /* Custom Animations */
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob { animation: blob 7s infinite; }
        .animation-delay-2000 { animation-delay: 2s; }
        .animation-delay-4000 { animation-delay: 4s; }

        @keyframes float {
            0% { transform: translateY(0px) rotate(-10deg); opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { transform: translateY(-100vh) rotate(10deg); opacity: 0; }
        }

        @keyframes float-ultimate {
            0% { transform: translateY(0px) rotate(0deg); opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        @keyframes pulse-star {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        @keyframes wave {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(15deg); }
            75% { transform: rotate(-15deg); }
        }
        .animate-wave { animation: wave 1s ease-in-out; }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-in { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        @keyframes slideInRight {
            0% { transform: translateX(50px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }
        .slide-in-right { animation: slideInRight 0.4s ease-out forwards; }
        
        @keyframes fadeInUp {
            0% { transform: translateY(20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        .fade-in-up { animation: fadeInUp 0.4s ease-out forwards; }

        @keyframes fadeOut {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }
        .fade-out { animation: fadeOut 0.3s ease-in forwards; }

        /* Custom Cursor */
        #custom-cursor {
            pointer-events: none;
            position: fixed;
            z-index: 9999;
            transition: transform 0.1s ease-out;
            transform: translate(-50%, -50%);
            mix-blend-mode: multiply;
        }

        /* Range Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #ec4899;
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 2px 6px rgba(236, 72, 153, 0.4);
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            cursor: pointer;
            background: #fce7f3;
            border-radius: 4px;
        }
        
        .polaroid-hover:hover {
            transform: scale(1.05) rotate(0deg) !important;
            z-index: 10;
        }

        .dark #custom-cursor {
            mix-blend-mode: screen;
            color: #f472b6 !important;
        }
    </style>
</head>

<body class="transition-colors duration-1000 bg-gradient-to-br from-rose-50 via-pink-50 to-purple-50 dark:from-slate-900 dark:via-slate-800 dark:to-slate-900 text-slate-800 dark:text-slate-100 selection:bg-pink-300 selection:text-white min-h-[100dvh] w-full flex flex-col items-center justify-center relative" ondblclick="handleDoubleClick(event)">

    <!-- Custom Cursor -->
    <div id="custom-cursor" class="text-pink-400 opacity-70 drop-shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
    </div>

    <!-- Background Elements Container -->
    <div id="bg-layer" class="fixed inset-0 pointer-events-none overflow-hidden z-0">
        <!-- Blobs -->
        <div class="absolute top-0 left-0 w-96 h-96 bg-pink-300/30 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob"></div>
        <div class="absolute top-0 right-0 w-96 h-96 bg-purple-300/30 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob animation-delay-2000"></div>
        <div class="absolute -bottom-32 left-20 w-96 h-96 bg-rose-300/30 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob animation-delay-4000"></div>
        
        <div id="stars-container" class="absolute inset-0 hidden"></div>
        <div id="particles-container" class="absolute inset-0"></div>
    </div>

    <!-- Utility Controls -->
    <div class="fixed top-4 right-4 flex gap-4 z-50">
        <button onclick="toggleAudio()" class="p-3 rounded-full bg-white/30 backdrop-blur-md shadow-sm hover:bg-white/50 hover:scale-110 transition-all text-pink-500" id="btn-audio">
            <!-- Muted Icon -->
            <svg id="icon-muted" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
            <!-- Unmuted Icon (Hidden initially) -->
            <svg id="icon-unmuted" class="hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
        </button>
        <button onclick="toggleTheme()" class="p-3 rounded-full bg-white/30 backdrop-blur-md shadow-sm hover:bg-white/50 hover:scale-110 transition-all text-indigo-500" id="btn-theme">
            <!-- Moon Icon -->
            <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
            <!-- Sun Icon (Hidden initially) -->
            <svg id="icon-sun" class="hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>
        </button>
    </div>

    <!-- Teddy Bear -->
    <div class="fixed bottom-4 left-4 z-40 cursor-pointer text-4xl filter drop-shadow-md" id="teddy" onclick="waveTeddy()">🧸</div>

    <!-- Active Quote Overlay -->
    <div id="quote-overlay" class="fixed bottom-10 text-center w-full z-30 pointer-events-none opacity-0 transition-opacity duration-500 px-4">
        <span id="quote-text" class="inline-block px-6 py-2 bg-white/70 dark:bg-slate-800/80 backdrop-blur-md rounded-full shadow-sm text-sm font-medium italic text-pink-600 dark:text-pink-400 border border-white/50 dark:border-slate-700"></span>
    </div>

    <!-- Main Content Area (Dynamic) -->
    <main id="main-content" class="w-full max-w-md mx-auto p-4 sm:p-6 py-24 relative z-10 flex flex-col items-center justify-center min-h-[400px]">
        <!-- Content will be injected here by JS -->
    </main>

    <script>
        // Data Arrays (Personalized for Vidhi)
        const QUESTIONS = [
            { id: 'q1', type: 'text', q: "Vidhi, what's your favourite thing about me? 😊", placeholder: "Type something sweet..." },
            { id: 'q2', type: 'choice', q: "Who's the funniest person you know?", options: ["You 😂", "Definitely You 😆", "Obviously You ❤️"] },
            { id: 'q3', type: 'slider', q: "How much do you like talking to me?", min: 0, max: 100 },
            { id: 'q4', type: 'choice', q: "Do I make you smile, Vidhi?", options: ["Every time 😊", "Most of the time ❤️", "Always 😄"] },
            { id: 'q5', type: 'text', q: "What's one word that describes us?", placeholder: "One word..." },
            { id: 'ready', type: 'ready', q: "Ready for the final question, Vidhi?", buttonText: "I'm Ready ❤️" }
        ];

        const NO_MESSAGES = [
            { q: "Are you absolutely sure, Vidhi? 🥺", btns: ["Yes", "Let me think"] },
            { q: "Maybe I can change your mind? ❤️", btns: ["Maybe", "Still No"] },
            { q: "Think one more time... good things deserve one extra chance. 🌸", btns: ["Okay...", "No"] },
            { q: "Vidhi, you're breaking my little heart 🥹", btns: ["I'm sorry", "No"] },
            { q: "I spent way too much time making this 😭❤️", btns: ["Okay, fine", "Still No"] },
            { q: "Pretty please, Vidhi?", btns: ["Yes", "No"] },
            { q: "One tiny chance?", btns: ["Maybe", "Nope"] },
            { q: "I'll keep trying until you smile 😊", btns: ["I'm smiling", "No"] },
            { q: "Can I ask just one last time?", btns: ["Okay", "No"] },
            { q: "I promise unlimited bad jokes and good food 🍕", btns: ["Deal", "No"] },
            { q: "Vidhi, still thinking...? ❤️", btns: ["Yes", "No"] }
        ];

        const QUOTES = [
            "Vidhi, you make my heart smile.",
            "Every moment with you is magic.",
            "I love you more than pizza.",
            "You're my favorite notification.",
            "Life is better with you in it, Vidhi."
        ];

        // SVGs
        const SVGS = {
            heartFilled: `<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>`,
            heartOutline: `<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>`,
            sparkles: `<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>`,
            send: `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" x2="11" y1="2" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>`,
            camera: `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>`,
            film: `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18"/><path d="M3 7.5h4"/><path d="M3 12h18"/><path d="M3 16.5h4"/><path d="M17 3v18"/><path d="M17 7.5h4"/><path d="M17 16.5h4"/></svg>`,
            icecream: `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 11 4.08 10.35a1 1 0 0 0 1.84 0L17 11"/><path d="M17 7A5 5 0 0 0 7 7c0 2 1.5 4 1.5 4h7s1.5-2 1.5-4Z"/></svg>`,
            car: `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>`,
            plane: `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.2-1.1.7l-1.3 2.6c-.2.4-.1.9.3 1.1L9 14l-4 4-2.8-.7c-.4-.1-.8.1-1 .4L.4 19c-.2.3-.1.8.2 1l5.5 2.5 2.5 5.5c.2.3.7.4 1 .2l1.3-1.1c.3-.2.5-.6.4-1l-.7-2.8 4-4 3.4 6.3c.2.4.7.5 1.1.3l2.6-1.3c.5-.2.8-.6.7-1.1Z"/></svg>`
        };

        // State
        window.appState = {
            stage: 'landing', // landing, questions, proposal, yes, no, gallery, final-no
            qIndex: 0,
            answers: {},
            noCount: 0,
            isNightMode: false,
            isMuted: true,
            ultimateMode: false,
            audioStarted: false
        };

        // Audio Setup
        const audio = new Audio('https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=romantic-piano-111003.mp3');
        audio.loop = true;
        audio.volume = 0.3;

        // Context Setup
        const mainContent = document.getElementById('main-content');

        // Cursor Tracking
        const cursor = document.getElementById('custom-cursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        // Double Click Hearts
        function handleDoubleClick(e) {
            const heart = document.createElement('div');
            heart.innerHTML = SVGS.heartFilled;
            heart.className = 'fixed pointer-events-none z-50 text-pink-500 w-8 h-8';
            heart.style.left = (e.clientX - 16) + 'px';
            heart.style.top = (e.clientY - 16) + 'px';
            heart.style.animation = 'float 1.5s ease-out forwards';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 1500);
        }

        // Keyboard Konami / Love
        let keys = [];
        const konami = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
        const loveWord = ['l', 'o', 'v', 'e'];

        document.addEventListener('keydown', (e) => {
            keys.push(e.key);
            if (keys.length > 10) keys.shift();

            if (keys.join(',') === konami.join(',')) {
                window.appState.ultimateMode = true;
                triggerConfetti(true);
                updateBackgroundParticles();
            }
            
            if (keys.slice(-4).join('').toLowerCase() === loveWord.join('')) {
                triggerConfetti(false, true); // Hearts only
            }

            // Enter key for inputs
            if (e.key === 'Enter' && window.appState.stage === 'questions') {
                const currentQ = QUESTIONS[window.appState.qIndex];
                if (currentQ.type === 'text' && window.appState.answers[window.appState.qIndex]) {
                    nextQuestion();
                }
            }
        });

        // Background Particles Generation
        function updateBackgroundParticles() {
            const container = document.getElementById('particles-container');
            container.innerHTML = '';
            for(let i=0; i<30; i++) {
                const p = document.createElement('div');
                const isHeart = Math.random() > 0.5;
                p.innerHTML = isHeart ? '❤' : '✨';
                p.className = 'absolute text-pink-300/40';
                p.style.left = `${Math.random() * 100}vw`;
                p.style.top = `${Math.random() * 100}vh`;
                p.style.fontSize = `${Math.random() * 1.5 + 0.5}rem`;
                p.style.animation = `${window.appState.ultimateMode ? 'float-ultimate' : 'float'} ${Math.random() * 10 + 10}s linear infinite`;
                p.style.animationDelay = `${Math.random() * 5}s`;
                container.appendChild(p);
            }
        }
        updateBackgroundParticles();

        // Stars for night mode
        function generateStars() {
            const container = document.getElementById('stars-container');
            container.innerHTML = '';
            for(let i=0; i<50; i++) {
                const star = document.createElement('div');
                star.className = 'absolute bg-white rounded-full';
                star.style.top = `${Math.random() * 100}%`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.width = `${Math.random() * 3}px`;
                star.style.height = `${Math.random() * 3}px`;
                star.style.animation = `pulse-star ${Math.random() * 3 + 1}s infinite`;
                container.appendChild(star);
            }
        }
        generateStars();

        // Audio/Theme Toggles
        function toggleAudio() {
            playClickSound();
            window.appState.isMuted = !window.appState.isMuted;
            document.getElementById('icon-muted').classList.toggle('hidden');
            document.getElementById('icon-unmuted').classList.toggle('hidden');
            
            if (!window.appState.isMuted) {
                audio.play().catch(e => console.log("Audio play blocked", e));
                window.appState.audioStarted = true;
            } else {
                audio.pause();
            }
        }

        function toggleTheme() {
            playClickSound();
            window.appState.isNightMode = !window.appState.isNightMode;
            document.documentElement.classList.toggle('dark');
            document.getElementById('icon-moon').classList.toggle('hidden');
            document.getElementById('icon-sun').classList.toggle('hidden');
            
            const stars = document.getElementById('stars-container');
            if(window.appState.isNightMode) {
                stars.classList.remove('hidden');
            } else {
                stars.classList.add('hidden');
            }
        }

        // Teddy Wave
        function waveTeddy() {
            const teddy = document.getElementById('teddy');
            teddy.classList.remove('animate-wave');
            void teddy.offsetWidth; // trigger reflow
            teddy.classList.add('animate-wave');
        }

        // Random Quotes
        setInterval(() => {
            if (window.appState.stage === 'landing' || window.appState.stage === 'questions') {
                const quoteEl = document.getElementById('quote-overlay');
                const textEl = document.getElementById('quote-text');
                textEl.innerText = `"${QUOTES[Math.floor(Math.random() * QUOTES.length)]}"`;
                quoteEl.style.opacity = 1;
                setTimeout(() => { quoteEl.style.opacity = 0; }, 5000);
            }
        }, 20000);

        // Utilities
        function playClickSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.1);
            } catch(e) { }
        }

        function triggerConfetti(isUltimate = false, heartsOnly = false) {
            const duration = isUltimate ? 15000 : 5000;
            const end = Date.now() + duration;

            const frame = () => {
                confetti({
                    particleCount: isUltimate ? 10 : 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#ffb6c1', '#ffc0cb', '#ff69b4', '#fff0f5'],
                    shapes: heartsOnly ? ['heart'] : ['circle', 'square']
                });
                confetti({
                    particleCount: isUltimate ? 10 : 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#ffb6c1', '#ffc0cb', '#ff69b4', '#fff0f5'],
                    shapes: heartsOnly ? ['heart'] : ['circle', 'square']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            };
            frame();
        }

        function typewriterEffect(elementId, text, delay = 0, speed = 50) {
            setTimeout(() => {
                const el = document.getElementById(elementId);
                if (!el) return;
                el.innerHTML = '';
                let i = 0;
                
                // Add cursor
                const cursorSpan = document.createElement('span');
                cursorSpan.className = 'animate-pulse inline-block w-[2px] h-[1em] bg-pink-400 ml-1 align-middle';
                
                const textNode = document.createTextNode('');
                el.appendChild(textNode);
                el.appendChild(cursorSpan);

                const interval = setInterval(() => {
                    if (i < text.length) {
                        textNode.nodeValue += text.charAt(i);
                        i++;
                    } else {
                        clearInterval(interval);
                    }
                }, speed);
            }, delay);
        }

        // Core View Transitions
        function render(viewHTML, noFadeOut = false) {
            if (noFadeOut) {
                mainContent.innerHTML = viewHTML;
                return;
            }

            mainContent.classList.add('fade-out');
            setTimeout(() => {
                mainContent.innerHTML = viewHTML;
                mainContent.classList.remove('fade-out');
            }, 300);
        }

        function getHeartProgress() {
            let html = '<div class="flex gap-2 mb-4 w-full justify-center">';
            for(let i=0; i<QUESTIONS.length; i++) {
                const isActive = i <= window.appState.qIndex;
                const colorClass = isActive ? "text-pink-500" : "text-pink-200";
                const icon = isActive ? SVGS.heartFilled : SVGS.heartOutline;
                const scaleClass = isActive ? "scale-110" : "scale-100";
                
                html += `
                    <div class="transition-all duration-300 ${scaleClass} w-5 h-5 ${colorClass}">
                        ${icon}
                    </div>
                `;
            }
            html += '</div>';
            return html;
        }

            playClickSound();

            window.appState.stage = 'questions';

            window.appState.answers[window.appState.qIndex] = val;

                    btn.classList.add('bg-gray-100', 'text-gray-400', 'cursor-not-allowed');
                    btn.classList.remove('bg-pink-100', 'text-pink-600', 'hover:bg-pink-200');

        function initScratchCard() {
            const canvas = document.getElementById('scratch-canvas');
            const ctx = canvas.getContext('2d');
            const container = document.getElementById('scratch-container');
            const content = document.getElementById('scratch-content');
            const subtitle = document.getElementById('proposal-subtitle');
            const buttons = document.getElementById('proposal-buttons');
            
            // Set exact canvas dimensions
            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;
            
            // Draw scratch-off surface (Silver gradient)
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, '#f1f5f9');
            gradient.addColorStop(0.3, '#cbd5e1');
            gradient.addColorStop(0.5, '#e2e8f0');
            gradient.addColorStop(0.7, '#94a3b8');
            gradient.addColorStop(1, '#f1f5f9');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Add instructions on the canvas
            ctx.font = 'bold 22px Inter, sans-serif';
            ctx.fillStyle = '#475569';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('Scratch to reveal ✨', canvas.width / 2, canvas.height / 2);
            
            let isDrawing = false;
            let isRevealed = false;
            
            function getBrushPos(clientX, clientY) {
                const rect = canvas.getBoundingClientRect();
                return {
                    x: (clientX - rect.left) / (rect.right - rect.left) * canvas.width,
                    y: (clientY - rect.top) / (rect.bottom - rect.top) * canvas.height
                };
            }

            function scratch(e) {
                if (!isDrawing || isRevealed) return;
                e.preventDefault(); // Prevent scrolling while scratching
                
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                
                const pos = getBrushPos(clientX, clientY);
                
                // Destination-out makes drawn areas transparent
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 35, 0, Math.PI * 2); // Brush size: 35px
                ctx.fill();
            }

            function checkReveal() {
                if (isRevealed) return;
                
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const pixels = imageData.data;
                let transparentPixels = 0;
                
                // Sample every 4th pixel for performance to check alpha channel
                for (let i = 3; i < pixels.length; i += 16) {
                    if (pixels[i] < 128) { // If largely transparent
                        transparentPixels++;
                    }
                }
                
                const totalPixelsChecked = pixels.length / 16;
                const percentage = (transparentPixels / totalPixelsChecked) * 100;
                
                // If more than 40% is scratched off, reveal everything!
                if (percentage > 40) {
                    isRevealed = true;
                    
                    // Fade out canvas
                    canvas.classList.add('opacity-0', 'pointer-events-none');
                    setTimeout(() => canvas.remove(), 700);
                    
                    // Fade in content
                    content.classList.remove('opacity-0');
                    subtitle.classList.remove('opacity-0');
                    
                    // Activate Buttons
                    buttons.classList.remove('opacity-0', 'scale-95', 'pointer-events-none');
                    buttons.classList.add('opacity-100', 'scale-100');
                    
                    // Pop some mini hearts as a reward!
                    triggerConfetti(false, true);
                    playClickSound();
                }
            }

            // Bind Events
            canvas.addEventListener('mousedown', (e) => { isDrawing = true; scratch(e); });
            canvas.addEventListener('mousemove', scratch);
            window.addEventListener('mouseup', () => { 
                isDrawing = false; 
                if(!isRevealed) checkReveal(); 
            });
            
            canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); }, {passive: false});
            canvas.addEventListener('touchmove', scratch, {passive: false});
            window.addEventListener('touchend', () => { 
                isDrawing = false; 
                if(!isRevealed) checkReveal(); 
            });
        }

        function handleNo() {

            renderNoStage();

        function handleNoNext() {
            playClickSound();
            if (window.appState.noCount >= NO_MESSAGES.length - 1) {
                window.appState.stage = 'final-no';
                renderFinalNoStage();
            } else {
                window.appState.noCount++;

        function renderNoStage(isFast = false) {
            const index = Math.min(window.appState.noCount, NO_MESSAGES.length - 1);
            const msg = NO_MESSAGES[index];

            const html = `
